<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 银杏叶·金色版（落地页 hero 专用）：暖金扇形 + 双圆丘 + biloba 裂口 + 放射叶脉 -->
  <defs>
    <linearGradient id="leafGold" x1="32" y1="12" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="oklch(76% 0.15 88)"/>
      <stop offset="1" stop-color="oklch(58% 0.13 75)"/>
    </linearGradient>
    <clipPath id="bladeClipGold">
      <path
        d="M32 44
           L2.1 46.2
           A30 28 0 0 1 21.7 17.7
           L29.5 22.8
           Q32 27.5 34.5 22.8
           L42.3 17.7
           A30 28 0 0 1 61.9 46.2
           Z"
      />
    </clipPath>
  </defs>

  <!-- 叶柄 -->
  <path d="M32 44 L31 60" stroke="oklch(46% 0.09 70)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 叶瓣 -->
  <path
    d="M32 44
       L2.1 46.2
       A30 28 0 0 1 21.7 17.7
       L29.5 22.8
       Q32 27.5 34.5 22.8
       L42.3 17.7
       A30 28 0 0 1 61.9 46.2
       Z"
    fill="url(#leafGold)"
  />

  <!-- 放射叶脉 -->
  <g stroke="oklch(96% 0.03 88)" stroke-width="1.1" stroke-linecap="round" opacity="0.65" clip-path="url(#bladeClipGold)">
    <path d="M32 44 L8.1 31.1"/>
    <path d="M32 44 L16.2 22.9"/>
    <path d="M32 44 L24.9 19.1"/>
    <path d="M32 44 L39.1 19.1"/>
    <path d="M32 44 L47.8 22.9"/>
    <path d="M32 44 L55.9 31.1"/>
  </g>
</svg>
